name: action-selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the action against the example playbooks
        uses: ./
        with:
          paths: examples
          fail-on: never
      - name: The action must exit clean on the secure example
        uses: ./
        with:
          paths: examples/secure-playbook.yml
          fail-on: error
