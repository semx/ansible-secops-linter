# Fixture for the secret flow rules. Each task name ends with what ansible-core
# does with the secret: "leaks" (printed at default verbosity), "leaks -v"
# (printed with -v), "masked" (ansible blanks it in the output, but it is still
# on the command line of the target) or "clean". The secret itself is passed in
# with -e so this file never contains it. tests/test_ansible_verify.py runs the play and checks
# the linter against the real output.
---
- name: Secret flow fixture
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    users:
      - name: alice
        password: "{{ secret }}"
  tasks:
    - name: debug var (leaks)
      ansible.builtin.debug:
        var: secret

    - name: debug msg (leaks)
      ansible.builtin.debug:
        msg: "connecting with {{ secret }}"

    - name: loop without label (leaks)
      ansible.builtin.command: /usr/bin/true
      loop: "{{ users }}"
      changed_when: false

    - name: loop with label (leaks -v)
      ansible.builtin.command: /usr/bin/true
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: failing command with secret argument (leaks)
      ansible.builtin.command: /nonexistent --token {{ secret }}
      ignore_errors: true

    - name: failing command with secret after a password flag (masked)
      ansible.builtin.command: /nonexistent --password {{ secret }}
      ignore_errors: true

    - name: failing command with secret in environment (clean)
      ansible.builtin.command: /nonexistent
      environment:
        APP_PASSWORD: "{{ secret }}"
      ignore_errors: true

    - name: failing command with no_log (clean)
      ansible.builtin.command: /nonexistent --password {{ secret }}
      ignore_errors: true
      no_log: true

    - name: failing uri with secret in url (leaks)
      ansible.builtin.uri:
        url: "http://127.0.0.1:9/api?token={{ secret }}"
      ignore_errors: true

    - name: failing uri with secret in header (clean)
      ansible.builtin.uri:
        url: http://127.0.0.1:9/api
        headers:
          Authorization: "Bearer {{ secret }}"
      ignore_errors: true

    - name: set_fact from secret (leaks -v)
      ansible.builtin.set_fact:
        dsn: "postgres://app:{{ secret }}@db/app"

    - name: register with no_log (clean)
      ansible.builtin.command: /bin/echo token={{ secret }}
      register: login
      changed_when: false
      no_log: true

    - name: debug registered result (leaks)
      ansible.builtin.debug:
        var: login.stdout
